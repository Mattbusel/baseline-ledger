name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          [ -z "$chosen" ] && { ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$chosen/Contents/Developer"
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          udid=$(xcrun simctl list devices available | grep "$name (" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build -project BaselineLedger.xcodeproj -scheme BaselineLedger -configuration Debug             -destination "id=$udid" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Screenshots
        run: |
          udid=$UDID
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$udid" appearance dark || true
          app=$(find dd/Build/Products -name "BaselineLedger.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot home
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/00.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot live
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/01.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot finish
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/02.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot matches
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/03.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot match
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/04.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot stats
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/05.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot gear
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/06.png"
          xcrun simctl terminate "$udid" com.mattbusel.baselineledger || true
          xcrun simctl launch "$udid" com.mattbusel.baselineledger -shot journal
          sleep 6
          xcrun simctl io "$udid" screenshot "shots/07.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
